[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e3a"
version = "0.1.0"
description = "Entity-grounded 3D action anticipation research code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "Pillow",
    "einops",
    "safetensors",
    "opencv-python",
    "torch>=2.6",
    "torchvision>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
egoexo = [
    "ego4d",
    "pycocotools>=2.0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"
]
