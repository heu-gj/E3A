name: E3A CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  upstream-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned VGGT-Ω
        run: git submodule update --init third_party/vggt-omega
      - name: Check and apply E3A patch
        run: bash scripts/apply_patches.sh
      - name: Compile E3A source
        run: python -m compileall -q src tests scripts

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned VGGT-Ω utilities
        run: git submodule update --init third_party/vggt-omega
      - name: Install CPU PyTorch, E3A, and VGGT-Ω package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install -e third_party/vggt-omega
      - name: Run tests
        run: pytest -q
